# Sveltia CMS configuration for Skovbye Sexologi.
#
# Docs: https://github.com/sveltia/sveltia-cms
#
# ============================================================
# BACKEND — GitHub with self-hosted OAuth proxy
# ============================================================
#
# Sveltia speaks to the GitHub API with an access token. To get
# one without embedding a client secret in the frontend, we run
# an OAuth proxy that trades the OAuth `code` for a token
# server-side. That proxy runs as the `sveltia-auth` container
# on the NAS (see deploy/compose.staging.yml), reachable at
# `https://skovbyesexologi-com.stage.denfrievilje.dk/auth/*` via the staging Caddy
# front-door.
#
# ----------------------------------------------------------------
# ONE-TIME MANUAL SETUP
# ----------------------------------------------------------------
#
#   1. Register a GitHub OAuth App
#      https://github.com/settings/applications/new
#        Application name: Skovbye Sexologi CMS
#        Homepage URL:     https://skovbyesexologi.com
#        Authorization callback URL:
#          https://skovbyesexologi-com.stage.denfrievilje.dk/auth/callback
#      Copy the generated Client ID + Client Secret.
#
#   2. Bring up the staging compose stack on the NAS with
#      OAUTH_CLIENT_ID + OAUTH_CLIENT_SECRET in deploy/staging.env.
#      The `sveltia-auth` service serves the OAuth handshake at
#      /auth/* behind the Caddy front-door. Full bootstrap in
#      DEPLOY.md.
#
#   3. Comment out the test-repo block below, uncomment the
#      github block, commit, deploy.
#
# Keeping `test-repo` as the shipping default means `/admin` stays
# openable without a running OAuth proxy — test-repo saves never
# leave the browser tab.
#
# ============================================================
# COPY
# ============================================================
# Labels and hints follow the Apple Style Guide. A label is a plain
# noun in sentence case. A hint is one short sentence, present only
# where the label is not enough, and says what the editor sees or
# should do. No implementation terms, no reasons, no "optional".
# Explanations for developers go in comments like this one.
#
# ============================================================
# MEDIA
# ============================================================
# static/img/ is the editor's asset library and holds nothing but
# what an editor put there. Each image field has its own subfolder,
# so the library reads as a list of purposes:
#
#   static/img/portrait/   the bio portrait
#   static/img/studios/    studio logos on the intimacy-coordination page
#
# A new image field gets its own media_folder and public_folder
# beside these. Files the build or a script writes (portrait
# cutouts, link-preview images) live under static/gen/, which the
# CMS never lists.
#
# ============================================================
# I18N — native Sveltia multiple_folders structure
# ============================================================
# Content layout matches Sveltia's conventions so the editor can
# show both DA and EN in ONE collection with a locale switcher,
# instead of two parallel collections:
#
#   src/content/
#     site.{da,en}.json           ← file collection (the
#     contact.{da,en}.json          {{locale}} placeholder goes in
#     bio.{da,en}.json              the FILENAME)
#     home.{da,en}.json
#     services/
#       {da,en}/*.json            ← folder collection (the locale
#                                    is a SUBFOLDER under the
#                                    collection's `folder:`)
#
# Per-field i18n flags:
#   i18n: true       — translatable (different value per locale)
#   i18n: duplicate  — identical in both locales (structural data,
#                      shared assets, schema identifiers). When
#                      edited in the default locale (DA), the value
#                      auto-syncs to non-default locales.
#   i18n: false      — field lives only in the default locale.
# Collections + groups inherit `i18n: true` down to their fields
# unless a leaf explicitly overrides.
#
# ============================================================
# POSE PALETTE
# ============================================================
# The `options:` arrays for the three stage-pose selects MUST
# stay in sync with `src/lib/stage/poses.ts`. When editing
# poses.ts, also:
#   1. Regenerate SVG thumbnails: `pkgx pnpm icons`
#   2. Update the anchored option lists below.

pose_options_bubble: &pose_options_bubble
  - offstage
  - heroFarRight
  - heroRightBig
  - heroLeftBig
  - upperRightBig
  - centerMax
  - topRightSm
  - topLeftSm
  - bottomLeftSm
  - cornerBLtiny
  - fullBleed

pose_options_drops: &pose_options_drops
  - offstage
  - disperseLowC
  - disperseLowR
  - disperseLowL
  - disperseRightMid
  - topRightMed
  - topLeftSm
  - bottomLeftMed
  - cornerTLtiny
  - cornerBRsm
  - cornerBLsm
  - fullBleed

pose_options_gem: &pose_options_gem
  - offstage
  - heroBRhuge
  - heroRightBig
  - midRightBig
  - cornerBRsm
  - cornerTRsm
  - topRightSm
  - topLeftSm
  - upperRightMed
  - fullBleed

# Editorial-workflow note: Sveltia writes every save to the
# `staging` branch (NOT main). A GH Actions workflow
# (`.github/workflows/deploy-staging.yml`) picks up every push to
# `staging` and rebuilds the staging site within ~2 min. Signe
# reviews there, and when happy clicks "Publish to production"
# at `/publish` on the staging domain — that page merges
# `staging` → `main` via the GitHub API, which triggers
# `deploy-production.yml` and the change lands on
# skovbyesexologi.com shortly after.
#
# This approach replaces Sveltia's native `editorial_workflow`
# feature (which is documented as not-yet-supported for GitHub at
# https://sveltiacms.app/en/docs/workflows/editorial). When that
# feature ships we can reconsider, but the two-branch + /publish
# button gives us the same UX without extra Sveltia dependency.
#
# base_url is the OAuth proxy's root. Sveltia appends /auth and
# /callback, which Caddy strips the /auth prefix from and
# forwards to the sveltia-auth container internally.
backend:
  name: github
  repo: den-frie-vilje/skovbyesexologi.com
  branch: staging
  base_url: https://skovbyesexologi-com.stage.denfrievilje.dk/auth
  site_domain: skovbyesexologi-com.stage.denfrievilje.dk

# Offline / no-auth fallback — uncomment to test the admin UI
# without the OAuth proxy running. Saves never leave the
# browser tab. Useful for pure UI/schema iteration.
#
# backend:
#   name: test-repo

media_folder: static/img
public_folder: /img

i18n:
  structure: multiple_folders
  locales: [da, en]
  default_locale: da

collections:
  # ---- Site metadata ----
  - name: site
    label: Site
    label_singular: Site
    editor: { preview: false }
    i18n: true
    files:
      - name: site
        label: Site
        file: 'src/content/site.{{locale}}.json'
        format: json
        i18n: true
        fields:
          - { name: name, label: Site name, widget: string, i18n: duplicate }
          - name: lang
            label: Language code
            widget: string
            i18n: duplicate
            readonly: true
            hint: Set by the site.
          - { name: tagline, label: Tagline, widget: string, i18n: true }
          - { name: leadIn, label: Introduction, widget: text, i18n: true }
          - name: footerCopyright
            label: Footer copyright
            widget: string
            i18n: true
            hint: 'Use {year}, {name} and {cvr}.'

  # ---- Contact info ----
  - name: contact
    label: Contact
    label_singular: Contact
    editor: { preview: false }
    i18n: true
    files:
      - name: contact
        label: Contact
        file: 'src/content/contact.{{locale}}.json'
        format: json
        i18n: true
        fields:
          - { name: label, label: Section label, widget: string, i18n: true }
          - { name: heading, label: Heading, widget: string, i18n: true }
          - { name: lede, label: Introduction, widget: text, i18n: true }
          - { name: email, label: Email, widget: string, i18n: duplicate }
          - { name: phone, label: Phone, widget: string, i18n: duplicate }
          - { name: address, label: Address, widget: string, i18n: true }
          - { name: cvr, label: CVR number, widget: string, i18n: duplicate }
          - { name: hours, label: Opening hours, widget: string, i18n: true }
          - { name: responseTime, label: Response time, widget: text, i18n: true }
          - name: fieldLabels
            label: Field labels
            widget: object
            i18n: true
            fields:
              - { name: email, label: Email, widget: string, i18n: true }
              - { name: phone, label: Phone, widget: string, i18n: true }
              - { name: address, label: Address, widget: string, i18n: true }
              - { name: hours, label: Opening hours, widget: string, i18n: true }
          - name: socials
            label: Social profiles
            widget: list
            required: false
            i18n: duplicate
            hint: Shown as icons in the footer.
            summary: '{{fields.platform}} · {{fields.url}}'
            fields:
              - name: platform
                label: Platform
                widget: select
                options:
                  - { label: LinkedIn, value: linkedin }
                  - { label: Instagram, value: instagram }
                  - { label: Facebook, value: facebook }
                  - { label: Bluesky, value: bluesky }
                  - { label: 'X (Twitter)', value: x }
                  - { label: YouTube, value: youtube }
              - name: url
                label: Link
                widget: string
                required: false
                hint: Leave empty to hide.

  # ---- Bio ----
  - name: bio
    label: Bio
    label_singular: Bio
    editor: { preview: false }
    i18n: true
    files:
      - name: bio
        label: Bio
        file: 'src/content/bio.{{locale}}.json'
        format: json
        i18n: true
        fields:
          - { name: label, label: Section label, widget: string, i18n: true }
          - { name: heading, label: Heading, widget: string, i18n: true }
          - { name: pronouns, label: Pronouns, widget: string, i18n: true }
          - name: portrait
            label: Portrait
            widget: image
            i18n: duplicate
            media_folder: /static/img/portrait
            public_folder: /img/portrait
            hint: Use a photo taken against a plain, evenly lit wall, at least 1200 px wide.
          - name: portraitGround
            label: Background
            widget: select
            i18n: duplicate
            default: transparent
            options:
              - { label: None, value: transparent }
              - { label: Quiet floor, value: floor }
              - { label: White, value: white }
              - { label: Warm, value: warm }
              - { label: Chartreuse, value: chartreuse }
              - { label: Cool, value: cool }
            hint: Link previews show Quiet floor as None.
          - { name: portraitAlt, label: Portrait description, widget: string, i18n: true, hint: For screen readers. }
          - name: body
            label: Body
            widget: markdown
            i18n: true
            # Inline marks only — bio paragraphs, not a document. No
            # headings (the section already has its own heading) and no
            # image/code inserts. Each blank-line-separated paragraph
            # fades in with a slight stagger on the page.
            buttons: [bold, italic, link]
            editor_components: []
            hint: Leave an empty line between paragraphs.

  # ---- Home page (includes stage choreography) ----
  - name: home
    label: Home
    label_singular: Home
    editor: { preview: false }
    i18n: true
    files:
      - name: home
        label: Home
        file: 'src/content/home.{{locale}}.json'
        format: json
        i18n: true
        fields:
          - name: hero
            label: Hero
            widget: object
            i18n: true
            fields:
              - { name: name, label: Name, widget: string, i18n: true }
              - { name: city, label: City, widget: string, i18n: true }
              - name: statement
                label: Statement
                widget: markdown
                i18n: true
                # Single field replacing the old start/end/em split.
                # Each line break is a display line; italic = the accent
                # underline. No headings/bold/links — it's a one-line
                # marquee statement.
                buttons: [italic]
                editor_components: []
                hint: Press Return for a new line. Italic text is underlined.
              - { name: attribution, label: Role line, widget: text, i18n: true }
              - { name: scrollLabel, label: Scroll label, widget: string, i18n: true }

          - name: nameSection
            label: Name and role
            widget: object
            i18n: true
            fields:
              - { name: eyebrow, label: Top line, widget: string, i18n: true }
              # firstName + lastName: structurally shared — DA edits copy to EN
              - { name: firstName, label: First name, widget: string, i18n: duplicate }
              - { name: lastName, label: Last name, widget: string, i18n: duplicate }
              - { name: pronouns, label: Pronouns, widget: string, i18n: true }
              - { name: roleLine, label: Role, widget: text, i18n: true }
              - { name: roleSub, label: Role details, widget: text, i18n: true }

          - name: chapter1
            label: 'Chapter I: Terapi'
            widget: object
            i18n: true
            fields:
              - { name: mark, label: Numeral, widget: string, i18n: duplicate }
              - { name: title, label: Title, widget: string, i18n: true }
              - { name: lede, label: Introduction, widget: text, i18n: true }
          - name: chapter2
            label: 'Chapter II: Konsulentydelser'
            widget: object
            i18n: true
            fields:
              - { name: mark, label: Numeral, widget: string, i18n: duplicate }
              - { name: title, label: Title, widget: string, i18n: true }
              - { name: lede, label: Introduction, widget: text, i18n: true }

          - name: manifest
            label: Manifest
            widget: object
            i18n: true
            fields:
              - { name: label, label: Section label, widget: string, i18n: true }
              - name: items
                label: Lines
                widget: list
                i18n: true
                summary: '{{fields.text}}'
                fields:
                  - name: text
                    label: Line
                    widget: markdown
                    buttons: [italic]
                    editor_components: []
                    i18n: true
                    hint: Italic text is underlined.
          - name: ritual
            label: Ritual
            widget: object
            i18n: true
            fields:
              - { name: label, label: Section label, widget: string, i18n: true }
              - { name: subtitle, label: Subtitle, widget: string, i18n: true }
              - name: steps
                label: Steps
                widget: list
                i18n: true
                fields:
                  - { name: n, label: Number, widget: string, i18n: duplicate }
                  - { name: title, label: Title, widget: string, i18n: true }
                  - { name: body, label: Text, widget: text, i18n: true }
          - name: forPersonal
            label: Kom forbi hvis du
            widget: object
            i18n: true
            fields:
              - { name: label, label: Section label, widget: string, i18n: true }
              - name: items
                label: Lines
                widget: list
                i18n: true
                field: { name: line, label: Line, widget: string, i18n: true }

          - name: forWork
            label: Skriv hvis I
            widget: object
            i18n: true
            fields:
              - { name: label, label: Section label, widget: string, i18n: true }
              - name: items
                label: Lines
                widget: list
                i18n: true
                field: { name: line, label: Line, widget: string, i18n: true }

          - name: testimonials
            label: Testimonials
            widget: object
            required: false
            i18n: true
            fields:
              - { name: label, label: Section label, widget: string, i18n: true }
              - name: items
                label: Quotes
                widget: list
                i18n: true
                summary: '{{fields.source}}'
                fields:
                  - { name: quote, label: Quote, widget: text, i18n: true }
                  - { name: source, label: Source, widget: string, i18n: true }

          # Stage choreography is part of the page's STRUCTURE,
          # not its copy — `i18n: duplicate` keeps DA + EN on
          # identical pose sequences so the WebGL scroll
          # choreography stays in lock-step across locales.
          - name: stage
            label: Stage
            widget: object
            i18n: duplicate
            fields:
              - name: sections
                label: Sections
                widget: list
                allow_add: false
                collapsed: false
                hint: One entry per section. Don’t change an ID. Services set their own.
                fields:
                  - { name: id, label: ID, widget: string }
                  - name: stage
                    label: Pose
                    widget: object
                    fields:
                      - { name: bubble, label: Orb, widget: select, default: offstage, options: *pose_options_bubble }
                      - { name: drops, label: Drops, widget: select, default: offstage, options: *pose_options_drops }
                      - { name: gem, label: Gem,  widget: select, default: offstage, options: *pose_options_gem  }
                      - { name: intensity, label: Intensity, widget: number, value_type: float, min: 0.5, max: 2.0, step: 0.05, default: 1.0 }

  # ---- Services (folder; one file per service × per locale) ----
  #
  # Sveltia's multiple_folders pattern puts the locale as a
  # subfolder of the collection's `folder:` path. Resulting tree:
  #   src/content/services/da/terapi.json
  #   src/content/services/en/terapi.json
  #
  # Filenames are shared across locales (stable cross-locale `id`),
  # so saving a service writes BOTH files with identical basenames.
  # The `slug` field is translatable — it's the per-locale URL
  # segment that appears in /ydelser/{slug} (DA) or
  # /en/services/{slug} (EN).
  - name: services
    label: Services
    label_singular: Service
    folder: src/content/services
    format: json
    extension: json
    # The site enumerates this collection: every service here gets a
    # section on the homepage (under its chapter, in `number` order), a
    # menu entry, a detail page and a sitemap entry. Its link-preview
    # image falls back to the home image until `pnpm og` has run.
    create: true
    delete: true
    slug: '{{fields.slug}}'
    identifier_field: title
    editor: { preview: false }
    i18n: true
    fields:
      - name: slug
        label: Web address
        widget: string
        i18n: true
        hint: The last part of the page link, such as terapi.
      - name: number
        label: Number
        widget: string
        i18n: duplicate
        hint: Two digits, such as 01. Sets the order.
      - name: chapter
        label: Chapter
        widget: select
        i18n: duplicate
        default: terapi
        options:
          - { label: 'Chapter I: Terapi', value: terapi }
          - { label: 'Chapter II: Konsulentydelser', value: konsulent }
        hint: Sets the colours and where the service appears.
      - { name: title, label: Title, widget: string, i18n: true }
      - { name: kicker, label: Audience, widget: string, i18n: true, hint: Such as film · tv · teater. }
      - { name: blurb, label: Summary, widget: text, i18n: true }
      - name: body
        label: Body
        widget: markdown
        required: false
        i18n: true
        # Toolbar limited to what the detail page renders: bold,
        # italic, links, and two heading levels. `editor_components: []`
        # drops the code-block/image inserts — body is prose only.
        # Italic inside a heading renders as the site's accent-underline
        # emphasis (the chartreuse highlighter); in body text it stays
        # plain italic.
        buttons: [bold, italic, link, heading-two, heading-three]
        editor_components: []
        hint: Shown on the service page. Italic text in a heading is highlighted.
      - name: bullets
        label: Bullets
        widget: list
        i18n: true
        field: { name: bullet, label: Bullet, widget: string, i18n: true }
      - name: showDetailBullets
        label: Show bullets on the service page
        widget: boolean
        default: true
        i18n: duplicate
        hint: The home page always shows them.
      - { name: supportsLabel, label: Keywords heading, widget: string, i18n: true, required: false }
      - name: supports
        label: Keywords
        widget: list
        required: false
        i18n: true
        field: { name: keyword, label: Keyword, widget: string, i18n: true }
      - name: testimonials
        label: Testimonials
        widget: list
        required: false
        i18n: true
        summary: '{{fields.source}}'
        fields:
          - { name: quote, label: Quote, widget: text, i18n: true }
          - { name: source, label: Source, widget: string, i18n: true }
      - name: pullQuote
        label: Pull quote
        widget: text
        required: false
        i18n: true
        hint: Shown large on the home page.
      - name: cta
        label: Button
        widget: object
        required: false
        i18n: true
        fields:
          - { name: label, label: Text, widget: string, i18n: true }
          - { name: href, label: Link, widget: string, i18n: duplicate, hint: 'A web, mailto: or tel: link.' }
          - name: kind
            label: Style
            widget: select
            i18n: duplicate
            default: primary
            options:
              - { label: Primary, value: primary }
              - { label: Secondary, value: secondary }
      - { name: studiosLabel, label: Studios heading, widget: string, i18n: true, required: false }
      - name: studios
        label: Studios
        widget: list
        required: false
        i18n: duplicate
        fields:
          - { name: name, label: Name, widget: string }
          - name: logo
            label: Logo
            widget: image
            media_folder: /static/img/studios
            public_folder: /img/studios
            hint: A black SVG on a transparent background.
          - { name: url, label: Link, widget: string, required: false }
      - name: homeStage
        label: Stage on the home page
        widget: object
        i18n: duplicate
        hint: Where the orb, drops and gem sit while this service is in view.
        fields:
          - { name: bubble, label: Orb, widget: select, default: offstage, options: *pose_options_bubble }
          - { name: drops, label: Drops, widget: select, default: offstage, options: *pose_options_drops }
          - { name: gem, label: Gem,  widget: select, default: offstage, options: *pose_options_gem  }
          - { name: intensity, label: Intensity, widget: number, value_type: float, min: 0.5, max: 2.0, step: 0.05, default: 1.0 }
      - name: stage
        label: Stage on the service page
        widget: object
        i18n: duplicate
        fields:
          - { name: bubble, label: Orb, widget: select, default: offstage, options: *pose_options_bubble }
          - { name: drops, label: Drops, widget: select, default: offstage, options: *pose_options_drops }
          - { name: gem, label: Gem,  widget: select, default: offstage, options: *pose_options_gem  }
          - { name: intensity, label: Intensity, widget: number, value_type: float, min: 0.5, max: 2.0, step: 0.05, default: 1.0 }
